[project]
name = "traffic-rag"
version = "1.0.0"
description = "交通领域 RAG 智能问答系统"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data Layer
    "pdfplumber>=0.11.0",
    "pymilvus>=2.4.0",
    "neo4j>=5.25.0",
    "sentence-transformers>=3.3.0",
    # Generation Layer
    "openai>=1.60.0",
    # Guardrails
    "pyahocorasick>=2.1.0",
    "transformers>=4.46.0",
    # Session
    "redis>=5.2.0",
    # Common
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Eval
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
